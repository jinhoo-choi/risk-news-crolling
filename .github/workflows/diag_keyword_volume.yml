name: 진단 - 키워드 수집량 실측

on:
  workflow_dispatch:  # 수동 트리거 전용 — 이메일 발송 없음, 결과는 diag_result.txt로 커밋

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집량 실측 (읽기 전용)
        env:
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python diag_window_test.py | tee diag_result.txt

      - name: 결과 파일 커밋 (로그 회수용, 이메일 발송 아님)
        run: |
          git config user.name "claude-assistant"
          git config user.email "claude@anthropic.com"
          git add diag_result.txt
          git commit -m "chore: 키워드 수집량 진단 결과 (자동, 이메일 발송 없음)" || echo "변경 없음"
          git push
