name: Risk queue read-only diagnosis
on:
  push:
    branches: [diagnostic/risk-queue-403-20261104]
    paths: [.github/workflows/risk_queue_diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing queue access and rate-limit headers only
        env:
          RISK_QUEUE_TOKEN: ${{ secrets.RISK_QUEUE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('RISK_QUEUE_TOKEN', '')
          if not token:
              raise SystemExit('RISK_QUEUE_DIAG token_present=false')
          for label, url in [
              ('rate', 'https://api.github.com/rate_limit'),
              ('private_metadata', 'https://api.github.com/repos/jinhoo-choi/insight-bot-data'),
              ('private_ref', 'https://api.github.com/repos/jinhoo-choi/insight-bot-data/git/ref/heads/main'),
              ('source_config', 'https://api.github.com/repos/jinhoo-choi/risk-news-crolling/contents/risk_subscription_config.json?ref=main')]:
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer '+token, 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28', 'Cache-Control':'no-cache'})
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  raw = response.read(65536)
                  try:
                      data = json.loads(raw)
                  except (ValueError, UnicodeError):
                      data = {}
                  message = data.get('message', '').lower()
                  category = ('primary_rate_limit' if response.headers.get('X-RateLimit-Remaining') == '0'
                              else 'secondary_rate_limit' if 'secondary rate limit' in message or 'abuse' in message
                              else 'authorization' if any(s in message for s in ['resource not accessible','bad credentials','saml','permission','suspended'])
                              else 'other' if response.code >= 400 else 'ok')
                  result = {'probe':label, 'http':response.code, 'category':category,
                            'smtp_calls':0, 'paid_ai_calls':0, 'writes':0}
                  for field in ['X-RateLimit-Limit','X-RateLimit-Remaining','X-RateLimit-Used','X-RateLimit-Reset','Retry-After']:
                      value = response.headers.get(field,'')
                      result[field] = int(value) if value.isdigit() and len(value)<15 else None
                  request_id = response.headers.get('X-GitHub-Request-Id','')
                  import re
                  result['request_id'] = request_id if re.fullmatch(r'[A-Za-z0-9:-]{1,100}',request_id) else 'unconfirmed'
                  print('RISK_QUEUE_DIAG '+json.dumps(result,sort_keys=True))
          PY
