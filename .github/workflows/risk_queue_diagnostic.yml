          q.request, q.get = read_only, get_record
          started = time.monotonic()
          with patch.object(urllib.request, 'urlopen', side_effect=observe):
              q.preflight()
              before, _ = q.get('jobs/risk-production-41776567223.json')
              history, _ = q.source('seen_news.json')
              records = pending_reviews(q)
              if len(records) != len(leases):
                  raise RuntimeError('review_count_mismatch')
              head = q.request('/git/ref/heads/main')['object']['sha']
              root = q.request('/git/commits/'+head)['tree']['sha']
              start_tree_calls = calls[0]
              actual = q.file_shas(leases, root)
              tree_calls = calls[0]-start_tree_calls
              if actual != leases:
