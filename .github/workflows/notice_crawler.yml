name: 경쟁사 공지사항 수집

on:
  schedule:
    # KST 09:00, 12:00, 18:00
    - cron: "30 21 * * 1-5"
   
   
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Run Crawler
        run: |
          python notice_crawler.py

      - name: Commit CSV and Debug Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/*.csv || true
          git add debug/*.html || true

          git diff --cached --quiet || git commit -m "update broker notices"

      - name: Push Changes
        run: |
          git push
