name: 수동 보정 발송 (필터 누락분)

on:
  workflow_dispatch:  # 수동 트리거 전용 — 정기 스케줄 없음
    inputs:
      confirm_send:
        description: "전체 그룹메일로 발송합니다. 발송하려면 YES를 입력하세요"
        required: true
        default: "NO"

jobs:
  manual-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수동 보정 발송 실행
        env:
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          NO_RESULT_RECEIVER:   ${{ secrets.NO_RESULT_RECEIVER }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_API_KEY:       ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_CC:             ${{ secrets.EMAIL_CC }}
          CONFIRM_SEND:         ${{ inputs.confirm_send }}
        run: python manual_send.py
