name: Public article fetch diagnostic (read only)
on:
  push:
    branches: [diagnostic/news1-public-fetch-20261015]
    paths: [.github/workflows/public_source_probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch public News1 page without SMTP or queue access
        run: |
          python - <<'PY'
          import json
          from unittest.mock import patch
          import risk_subscription as bridge
          bot = bridge.import_bot()
          real_get = bot.requests.Session.get
          for i, ua in enumerate(bot.USER_AGENTS):
              details = {'agent_index': i, 'paid_ai_calls': 0, 'smtp_calls': 0, 'queue_writes': 0}
              def inspect_response(*args, **kwargs):
                  response = real_get(*args, **kwargs)
                  details['http_status'] = response.status_code
                  encoding = response.headers.get('Content-Encoding', 'identity')
                  details['encoding'] = encoding if encoding in ('gzip','deflate','br','identity') else 'other'
                  details['response_bytes'] = len(response.content)
                  details['embedded_article'] = 'contentArrange' in response.text
                  return response
              with patch.object(bot.requests.Session, 'get', inspect_response), patch.object(bot.random, 'choice', return_value=ua), patch.object(bot.smtplib, 'SMTP_SSL', side_effect=RuntimeError('SMTP disabled')), patch.object(bot.requests, 'post', side_effect=RuntimeError('POST disabled')):
                  body = bot.fetch_article_body('https://www.news1.kr/world/international-economy/6320475')
              details.update(body_chars=len(body), hpe_paragraph_present='휴렛팩커드엔터프라이즈(HPE)' in body)
              print(json.dumps(details, sort_keys=True))
          PY
