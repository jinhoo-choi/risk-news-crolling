name: 네이버 뉴스 리스크 모니터링

on:
  schedule:
    - cron: '31 22 * * *'  # KST 07:31
    - cron: '31 5 * * *'   # KST 14:31
    - cron: '31 11 * * *'  # KST 20:31
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crawl-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: seen_news.json 캐시 복원
        uses: actions/cache@v4
        with:
          path: seen_news.json
          key: seen-news-cache
          restore-keys: |
            seen-news-

      - name: 뉴스 크롤링 & AI 필터링 & 이메일 발송
        env:
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_news_monitor.py

      - name: seen_news.json 캐시 저장 (실패 시에도)
        if: always()
        uses: actions/cache@v4
        with:
          path: seen_news.json
          key: seen-news-cache

      - name: 실행 실패 시 로그 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: seen_news.json
          retention-days: 7
