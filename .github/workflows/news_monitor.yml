name: 네이버 뉴스 리스크 모니터링

on:
  workflow_dispatch:  # cron-job.org 및 수동 실행 (cron-job.org가 매시 7분 트리거)

# 동시 실행 방지 — 이전 실행 완료 후 다음 실행 시작 (race condition 방지)
concurrency:
  group: risk-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  crawl-broker-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas lxml

      - name: 경쟁사 공지사항 크롤링
        run: python broker_notices.py
        continue-on-error: true

      - name: CSV 커밋 & 푸시
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/*.csv || true
          git add debug/*.html || true
          git diff --cached --quiet || git commit -m "update broker notices"
          git push
        continue-on-error: true  # 경쟁사 공지는 부가기능 — 실패해도 본 모니터링 무관

  crawl-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: crawl-broker-notices
    if: always()   # broker 실패·스킵돼도 메인 탐지는 반드시 실행
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # requirements.txt 기반 캐시키 — 패키지 변경 시 자동 무효화
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 뉴스 크롤링 & AI 필터링 & 이메일 발송
        env:
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          NO_RESULT_RECEIVER:   ${{ secrets.NO_RESULT_RECEIVER }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_API_KEY:       ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_CC:             ${{ secrets.EMAIL_CC }}
        run: python naver_news_monitor.py

      - name: 티커 매핑 갱신 (탐지 후)
        run: |
          pip install yfinance --quiet || true
          python ticker_mapper.py
        continue-on-error: true  # 실패해도 무관

      # seen_news.json push 실패 시 다음 실행에서 옛날 seen 로드 → 중복 발송 위험
      # git pull --rebase 실패 시 즉시 종료 (|| true 제거) — 원인 파악 용이
      - name: seen_news.json 커밋 & 푸시
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add seen_news.json ticker_map.json || true
          git diff --cached --quiet || git commit -m "update seen_news [skip ci]"
          git push || exit 1

      - name: 필터링 로그 artifact 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-log-${{ github.run_id }}
          path: filter_log_*.json
          retention-days: 7
          if-no-files-found: warn   # 로그 없으면 경고 (ignore → warn)

      - name: 실행 실패 시 로그 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-${{ github.run_id }}
          path: seen_news.json
          retention-days: 7

