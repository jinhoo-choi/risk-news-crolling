name: 네이버 뉴스 리스크 모니터링

on:
  workflow_dispatch:  # cron-job.org 및 수동 실행 (cron-job.org가 매시 7분 트리거)

# 동시 실행 방지 — 이전 실행 완료 후 다음 실행 시작 (race condition 방지)
concurrency:
  group: risk-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  crawl-broker-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 경쟁사 공지사항 크롤링
        run: python broker_notices.py

      - name: 소스별 수집 상태 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-notices-status-${{ github.run_id }}
          path: broker_notices_status.json
          retention-days: 7
          if-no-files-found: error

      - name: CSV 커밋 & 푸시
        if: always()  # 일부 소스 실패 시에도 정상 수집분은 보존
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/*.csv || true
          git add debug/*.html || true
          git diff --cached --quiet || git commit -m "update broker notices"
          git push
        continue-on-error: true  # 경쟁사 공지는 부가기능 — 실패해도 본 모니터링 무관

  crawl-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: crawl-broker-notices
    if: always()   # broker 실패·스킵돼도 메인 탐지는 반드시 실행
    permissions:
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip 캐시 복원
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # requirements.txt 기반 캐시키 — 패키지 변경 시 자동 무효화
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 구독 큐 수집 (유료 AI 호출 0)
        id: collect
        env:
          RISK_QUEUE_TOKEN:     ${{ secrets.RISK_QUEUE_TOKEN }}
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER:       ${{ secrets.EMAIL_RECEIVER }}
          NO_RESULT_RECEIVER:   ${{ secrets.NO_RESULT_RECEIVER }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          EMAIL_CC:             ${{ secrets.EMAIL_CC }}
        run: python risk_subscription.py scheduled
      - name: Persist private collection outcome
        if: always()
        env:
          RISK_QUEUE_TOKEN: ${{ secrets.RISK_QUEUE_TOKEN }}
          RISK_AUDIT_OPERATION: collect-workflow
          RISK_AUDIT_JOB_ID: risk-production-${{ github.run_id }}
          RISK_AUDIT_CONSUME: ${{ steps.collect.outcome }}
        run: |
          if [ -f risk_audit.py ]; then
            python risk_audit.py
          else
            echo 'RISK_AUDIT state=failed recorded=false stage=started'
            exit 1
          fi

