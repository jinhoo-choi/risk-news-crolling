name: Risk subscription recent collection verification (API0)
on:
  push:
    branches: [codex/risk-subscription-20261014]
    paths: [risk_collection_test_request.json]
permissions:
  contents: read
concurrency:
  group: risk-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect actual recent inputs into private verification queue
        env:
          RISK_QUEUE_TOKEN: ${{ secrets.RISK_QUEUE_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python risk_subscription.py collect-test
